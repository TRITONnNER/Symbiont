name: symbiont
description: Симбионт — единый сервис связности (VPN + пробой + ускорение). Клиент.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  cryptography: ^2.7.0
  shared_preferences: ^2.2.2
  flutter_inappwebview: ^6.1.5   # WebView-хост дизайн-оболочки (Win/mac/Linux/Android/iOS)

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Дизайн-оболочка (webapp/), вшитая скриптом tools/sync_webapp.sh.
    # Flutter требует перечислять подкаталоги ассетов явно.
    - assets/webapp/
    - assets/webapp/fonts/
    - assets/webapp/flags/
    - assets/webapp/icons/
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
