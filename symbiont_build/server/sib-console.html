<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Симбионт · Server-in-a-Box — панель управления</title>
<!--
  Панель управления Server-in-a-Box. ОДИН файл, БЕЗ CDN и внешних запросов —
  скачивается и открывается на любом устройстве (ПК/ноут/планшет). Вход ВЛАДЕЛЬЦЕМ
  (ADMIN_TOKEN, все права) или РАБОТНИКОМ (staff-токен с ограниченным набором прав).
  Полный контроль сервиса: серверы, пользователи, поддержка, платежи, скидки, ключи,
  цены/экономика, блоки сайта и приложения, работники, журнал действий. Всё общение —
  с задеплоенным бэкендом по его /v1/admin/*.
-->
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel2:#0e141c; --line:#1f2a37;
    --fg:#e7eef7; --muted:#8aa0b6; --accent:#34E5B0; --accent2:#2bd0a0;
    --warn:#ffb020; --danger:#ff5d5d; --chip:#17212e; --blue:#39a0ff;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f7fb; --panel:#ffffff; --panel2:#f0f4f9; --line:#dde5ee;
           --fg:#0d1622; --muted:#5a6b7d; --chip:#eef3f8; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif}
  a{color:var(--accent)}
  .wrap{max-width:1160px;margin:0 auto;padding:16px}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
             padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  .logo{width:30px;height:30px;border-radius:8px;background:
        conic-gradient(from 210deg,var(--accent),var(--blue),var(--accent));flex:0 0 auto}
  .brand{font-weight:800;letter-spacing:.2px}
  .brand small{display:block;font-weight:500;color:var(--muted);letter-spacing:0}
  .spacer{flex:1}
  .whoami{font-size:13px;color:var(--muted)}
  .whoami b{color:var(--fg)}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--chip);
         color:var(--fg);border-radius:10px;padding:9px 14px}
  button.primary{background:var(--accent);color:#04231b;border-color:transparent;font-weight:700}
  button.ghost{background:transparent}
  button.danger{background:transparent;color:var(--danger);border-color:#5a2730}
  button.sm{padding:5px 10px;font-size:13px;border-radius:8px}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{font:inherit;background:var(--panel2);color:var(--fg);
         border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
        padding:18px;margin:14px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
  .tabs button{border-radius:999px}
  .tabs button.on{background:var(--accent);color:#04231b;border-color:transparent;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:14px}
  .scroll{overflow-x:auto}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
  th{color:var(--muted);font-weight:600}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;
        background:var(--chip);border:1px solid var(--line)}
  .pill.ok{color:var(--accent);border-color:#1c4a3c}
  .pill.bad{color:var(--danger);border-color:#5a2730}
  .pill.wait{color:var(--warn);border-color:#5a4a1c}
  .pill.blue{color:var(--blue);border-color:#1c3a5a}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .muted{color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media (max-width:820px){.grid3,.grid4{grid-template-columns:1fr 1fr}}
  @media (max-width:560px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .chat{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 0}
  .msg{max-width:82%;padding:9px 12px;border-radius:12px;background:var(--chip);white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-start}
  .msg.support{align-self:flex-end;background:var(--accent);color:#04231b}
  .msg .meta{display:block;font-size:11px;opacity:.7;margin-top:3px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
         background:var(--panel);border:1px solid var(--line);padding:12px 18px;border-radius:12px;
         box-shadow:0 8px 30px rgba(0,0,0,.35);display:none;z-index:80;max-width:90vw}
  .toast.err{border-color:#5a2730;color:var(--danger)}
  .toast.show{display:block}
  .empty{color:var(--muted);text-align:center;padding:26px}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
  .flagsec h4{margin:14px 0 6px}
  .flagrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
           padding:7px 0;border-bottom:1px dashed var(--line)}
  .sw{position:relative;width:44px;height:26px;flex:0 0 auto}
  .sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .sw span{position:absolute;inset:0;background:var(--chip);border:1px solid var(--line);
           border-radius:999px;transition:.15s}
  .sw span:before{content:"";position:absolute;left:3px;top:2px;width:20px;height:20px;
           background:var(--muted);border-radius:50%;transition:.15s}
  .sw input:checked + span{background:var(--accent);border-color:transparent}
  .sw input:checked + span:before{transform:translateX(18px);background:#04231b}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;
           justify-content:center;z-index:70;padding:16px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;
         max-width:680px;width:100%;max-height:88vh;overflow:auto}
  .stat{font-size:22px;font-weight:800;margin:2px 0}
  .clickrow{cursor:pointer}
  .clickrow:hover td{background:var(--panel2)}
</style>
</head>
<body>

<!-- ── ЭКРАН ВХОДА ─────────────────────────────────────────────────────────── -->
<div id="login" class="wrap" style="max-width:460px;margin-top:7vh">
  <div class="row" style="gap:10px;margin-bottom:6px">
    <div class="logo"></div>
    <div class="brand">Симбионт · Server-in-a-Box<small>панель управления сервисом</small></div>
  </div>
  <div class="card">
    <label>Адрес бэкенда (Base URL)</label>
    <input id="in-base" placeholder="https://api.example.com" autocomplete="off">
    <label>Вход как</label>
    <select id="in-role">
      <option value="owner">Владелец — по ADMIN_TOKEN (полный доступ)</option>
      <option value="worker">Работник — по staff-токену (ограниченный доступ)</option>
    </select>
    <label id="lbl-token">ADMIN_TOKEN</label>
    <input id="in-token" placeholder="токен" autocomplete="off">
    <div class="row" style="margin-top:14px">
      <button class="primary" id="btn-login">Войти</button>
      <span class="hint">Данные хранятся только в этом браузере (localStorage).</span>
    </div>
    <div id="login-err" class="hint" style="color:var(--danger)"></div>
  </div>
  <p class="hint">Владелец получает ADMIN_TOKEN при деплое бэкенда. Работникам владелец
  создаёт токены с нужными правами во вкладке «Работники».</p>
</div>

<!-- ── ПРИЛОЖЕНИЕ ──────────────────────────────────────────────────────────── -->
<div id="app" style="display:none">
  <header class="top">
    <div class="logo"></div>
    <div class="brand">Симбионт<small>Server-in-a-Box</small></div>
    <div class="spacer"></div>
    <div class="whoami" id="whoami"></div>
    <button class="ghost" id="btn-refresh" title="Обновить">↻</button>
    <button class="ghost" id="btn-logout">Выйти</button>
  </header>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const el = (t,a={},...kids)=>{const e=document.createElement(t);
  for(const k in a){ if(k==="class")e.className=a[k]; else if(k==="html")e.innerHTML=a[k];
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]); else if(a[k]!=null)e.setAttribute(k,a[k]); }
  for(const c of kids.flat()){ if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const short=s=>String(s||"").slice(0,8);

const state={ base:"", role:"owner", token:"", scopes:[], name:"", tab:"" };
function save(){ localStorage.setItem("sib-console", JSON.stringify({base:state.base,role:state.role,token:state.token})); }
function load(){ try{ return JSON.parse(localStorage.getItem("sib-console")||"{}"); }catch(_){ return {}; } }
function toast(msg,err){ const t=$("#toast"); t.textContent=msg; t.className="toast show"+(err?" err":"");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.className="toast",2800); }

async function api(path,{method="GET",body}={}){
  const h={"Content-Type":"application/json"};
  if(state.role==="owner") h["X-Admin-Token"]=state.token; else h["X-Staff-Token"]=state.token;
  let r; try{ r=await fetch(state.base.replace(/\/+$/,"")+path,{method,headers:h,body:body?JSON.stringify(body):undefined}); }
  catch(e){ throw new Error("сеть недоступна ("+e.message+")"); }
  let data=null; try{ data=await r.json(); }catch(_){}
  if(!r.ok){ const d=(data&&(data.detail||data.error))||r.status; throw new Error(typeof d==="string"?d:JSON.stringify(d)); }
  return data;
}
function fmtBytes(n){ n=+n||0; if(n<1024)return n+" Б"; if(n<1048576)return (n/1024).toFixed(1)+" КБ"; return (n/1048576).toFixed(2)+" МБ"; }
function fmtWhen(s){ if(!s)return "—"; if(typeof s==="number"){ const d=new Date(s*1000); return d.toISOString().slice(0,16).replace("T"," ")+" UTC"; }
  return String(s).replace("T"," ").replace("Z"," UTC"); }
function statCard(title,big,sub,onclick){ return el("div",{class:"card"+(onclick?" clickrow":""),style:"margin:0",onclick:onclick||null},
  el("div",{class:"muted"},title), el("div",{class:"stat"},big), sub?el("div",{class:"hint"},sub):null); }
function kvline(k,v){ return el("div",{class:"kv"}, el("span",{class:"muted"},k), el("span",{class:"mono"},v)); }
function field(lbl,input){ const w=el("div",{}); w.append(el("label",{},lbl),input); return w; }
function modal(node){ const ov=el("div",{class:"overlay",onclick:e=>{ if(e.target===ov)ov.remove(); }});
  const m=el("div",{class:"modal"}); m.append(node); ov.append(m); document.body.append(ov); return ov; }

// ── права → вкладки ───────────────────────────────────────────────────────────
const SCOPE_LABELS={nodes:"Серверы",users:"Пользователи",support:"Поддержка",billing:"Платежи",
  discounts:"Скидки",keys:"Ключи",economy:"Экономика",flags:"Блоки"};
const TABS=[
  {id:"overview",name:"Обзор",scope:null},
  {id:"servers",name:"Серверы",scope:"nodes"},
  {id:"users",name:"Пользователи",scope:"users"},
  {id:"support",name:"Поддержка",scope:"support"},
  {id:"payments",name:"Платежи",scope:"billing"},
  {id:"discounts",name:"Скидки",scope:"discounts"},
  {id:"keys",name:"Ключи",scope:"keys"},
  {id:"economy",name:"Экономика",scope:"economy"},
  {id:"flags",name:"Блоки",scope:"flags"},
  {id:"staff",name:"Работники",scope:"__owner__"},
  {id:"audit",name:"Журнал",scope:"__owner__"},
];
function allowed(tab){ if(tab.scope===null)return true; if(tab.scope==="__owner__")return state.role==="owner";
  return state.role==="owner"||state.scopes.includes(tab.scope); }
function renderTabs(){ const box=$("#tabs"); box.innerHTML=""; const vis=TABS.filter(allowed);
  if(!vis.some(t=>t.id===state.tab)) state.tab=vis[0]?.id||"overview";
  for(const t of vis) box.append(el("button",{class:state.tab===t.id?"on":"",
    onclick:()=>{state.tab=t.id;renderTabs();renderView();}},t.name)); }
function loading(){ $("#view").innerHTML='<div class="card empty">Загрузка…</div>'; }
const VIEWS={};
async function renderView(){ loading();
  try{ await (VIEWS[state.tab]||VIEWS.overview)(); }
  catch(e){ $("#view").innerHTML=""; $("#view").append(el("div",{class:"card"},el("div",{class:"empty",html:"Ошибка: "+esc(e.message)}))); } }

// ── ОБЗОР ─────────────────────────────────────────────────────────────────────
VIEWS.overview=async function(){
  const v=$("#view"); v.innerHTML="";
  const card=el("div",{class:"card"}); card.append(el("h3",{},"Состояние сервиса"));
  const g=el("div",{class:"grid4"}); card.append(g);
  const tryGet=async p=>{ try{ return await api(p); }catch(_){ return null; } };
  const nodes=await tryGet("/v1/admin/nodes");
  if(nodes) g.append(statCard("Серверы",nodes.nodes.filter(n=>n.alive).length+" / "+nodes.total,"онлайн / всего · v"+nodes.version,()=>{state.tab="servers";renderTabs();renderView();}));
  const users=await tryGet("/v1/admin/users?limit=1000");
  if(users){ const paying=users.users.filter(u=>u.tier!=="free").length;
    g.append(statCard("Пользователи",String(users.total),paying+" на платном",()=>{state.tab="users";renderTabs();renderView();})); }
  const sup=await tryGet("/v1/admin/support/threads");
  if(sup) g.append(statCard("Поддержка",sup.awaiting+" ждут",sup.total+" обращений",()=>{state.tab="support";renderTabs();renderView();}));
  const bs=await tryGet("/v1/admin/billing/summary");
  if(bs) g.append(statCard("Выручка (24ч)",(bs.revenue_rub_24h||0)+" ₽",(bs.revenue_rub_7d||0)+" ₽ за 7 дней",()=>{state.tab="payments";renderTabs();renderView();}));
  const disc=await tryGet("/v1/admin/discounts");
  if(disc) g.append(statCard("Скидки",disc.discounts.filter(d=>d.live).length+" активны",disc.total+" всего",()=>{state.tab="discounts";renderTabs();renderView();}));
  if(state.role==="owner"){ const db=await tryGet("/v1/admin/db/stats");
    if(db) g.append(statCard("База данных",(db.journal_mode||"").toUpperCase()+" · "+fmtBytes(db.size_bytes),db.keys+" ключей стейта")); }
  v.append(card);

  if(state.role==="owner"){
    const dbc=el("div",{class:"card"});
    dbc.append(el("div",{class:"row"},el("h3",{style:"margin:0;flex:1"},"База данных (реальная SQLite/WAL)"),
      el("button",{class:"primary",onclick:async e=>{ e.target.disabled=true;
        try{ const r=await api("/v1/admin/db/backup",{method:"POST"}); toast("Бэкап создан: "+fmtBytes(r.size_bytes)); }
        catch(err){ toast(err.message,true); } e.target.disabled=false; }},"Сделать бэкап")));
    try{ const db=await api("/v1/admin/db/stats"); const t=el("div",{style:"margin-top:8px"});
      t.append(kvline("Файл",db.path),kvline("Размер",fmtBytes(db.size_bytes)+(db.wal_bytes?(" (+WAL "+fmtBytes(db.wal_bytes)+")"):"")),
        kvline("Режим журнала",(db.journal_mode||"").toUpperCase()+" — атомарные транзакции"),kvline("Ключей стейта",String(db.keys)));
      dbc.append(t); dbc.append(el("p",{class:"hint"},"Ежедневный бэкап настроен таймером на сервере (03:30). Онлайн-снимок безопасен на живой базе."));
    }catch(_){}
    v.append(dbc);
  }
};

// ── СЕРВЕРЫ ───────────────────────────────────────────────────────────────────
VIEWS.servers=async function(){
  const v=$("#view"); v.innerHTML="";
  const d=await api("/v1/admin/nodes");
  const card=el("div",{class:"card"});
  card.append(el("div",{class:"row"},el("h3",{style:"margin:0;flex:1"},"Серверы (узлы флота)"),
    el("span",{class:"muted"},d.nodes.filter(n=>n.alive).length+" онлайн / "+d.total)));
  if(!d.total){ card.append(el("div",{class:"empty"},"Пока ни одного узла. Установите узел одной командой (get.sh) — появится здесь сам.")); }
  else{ const tb=el("table"); const wrap=el("div",{class:"scroll"},tb);
    tb.append(el("tr",{},...["Страна","Хост","Протоколы","Загрузка","Статус",""].map(h=>el("th",{},h))));
    for(const n of d.nodes){ tb.append(el("tr",{},
      el("td",{},el("b",{},(n.code?flag(n.code)+" ":"")+(n.country||short(n.id)))),
      el("td",{class:"muted mono"},n.host||"—"),
      el("td",{},(n.protocols||[]).map(p=>el("span",{class:"pill",style:"margin:1px"},p))),
      el("td",{},n.load_pct==null?"—":n.load_pct+"%"),
      el("td",{},n.alive?el("span",{class:"pill ok"},"онлайн"):el("span",{class:"pill bad"},"молчит")),
      el("td",{},el("button",{class:"danger sm",onclick:async()=>{ if(!confirm("Снять узел «"+(n.country||n.id)+"»?"))return;
        try{ await api("/v1/admin/node/"+encodeURIComponent(n.id)+"/remove",{method:"POST"}); toast("Узел снят"); renderView(); }catch(e){ toast(e.message,true); } }},"Снять")))); }
    card.append(wrap);
  }
  card.append(el("p",{class:"hint"},"Узел молчит дольше порога heartbeat — сам выпадает из списка; вернулся — появляется снова."));
  v.append(card);
  if(state.role==="owner"){
    const rc=el("div",{class:"card"});
    rc.append(el("h3",{},"Выкатка манифеста (canary)"));
    rc.append(el("p",{class:"hint"},"Доля клиентов, которым достаётся текущая версия. 1%→5%→25%→100%. Версия: "+d.version));
    const inp=el("input",{type:"number",min:"0",max:"100",value:"100",style:"max-width:120px"});
    rc.append(el("div",{class:"row"},field("Процент",inp),el("button",{class:"primary",style:"align-self:flex-end",onclick:async()=>{
      try{ const r=await api("/v1/admin/rollout",{method:"POST",body:{percent:parseInt(inp.value,10)||0}});
        toast("Выкатка "+r.rollout+"%"); }catch(e){ toast(e.message,true); } }},"Применить")));
    v.append(rc);
  }
};
function flag(code){ return (code||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,2)||"·"; }

// ── ПОЛЬЗОВАТЕЛИ ──────────────────────────────────────────────────────────────
VIEWS.users=async function(){
  const v=$("#view"); v.innerHTML="";
  const bar=el("div",{class:"card"});
  const q=el("input",{placeholder:"поиск по account_id…",style:"max-width:280px"});
  const tf=el("select",{style:"max-width:180px"},el("option",{value:""},"все тиры"),
    el("option",{value:"free"},"free"),el("option",{value:"premium"},"premium"),el("option",{value:"ultimate"},"ultimate"));
  const run=async()=>{ await fillUsers(list,q.value.trim(),tf.value); };
  q.addEventListener("keydown",e=>{ if(e.key==="Enter")run(); });
  tf.addEventListener("change",run);
  bar.append(el("div",{class:"row"},field("Поиск",q),field("Тир",tf),
    el("button",{class:"primary",style:"align-self:flex-end",onclick:run},"Найти")));
  v.append(bar);
  const list=el("div",{class:"card"}); v.append(list);
  await fillUsers(list,"","");
};
async function fillUsers(list,query,tier){
  list.innerHTML="Загрузка…";
  const d=await api("/v1/admin/users?limit=500"+(query?"&query="+encodeURIComponent(query):"")+(tier?"&tier="+tier:""));
  list.innerHTML="";
  list.append(el("div",{class:"row"},el("h3",{style:"margin:0;flex:1"},"Пользователи"),el("span",{class:"muted"},d.total+" найдено")));
  if(!d.total){ list.append(el("div",{class:"empty"},"Ничего не найдено.")); return; }
  const tb=el("table"); const wrap=el("div",{class:"scroll"},tb);
  tb.append(el("tr",{},...["Аккаунт","Тир","Покрытие","Часы","Дни","Устр.","Реф.","",""].map(h=>el("th",{},h))));
  for(const u of d.users){ tb.append(el("tr",{class:"clickrow",onclick:()=>openUser(u.account_id)},
    el("td",{},el("b",{class:"mono"},short(u.account_id)),u.fraud?el("span",{class:"pill bad",style:"margin-left:6px"},"фрод"):null),
    el("td",{},el("span",{class:"pill"+(u.tier!=="free"?" ok":"")},u.tier)),
    el("td",{class:"muted"},u.coverage),
    el("td",{},Math.round((u.active_minutes_left||0)/60*10)/10+" ч"),
    el("td",{},String(u.days_left||0)),
    el("td",{},String(u.devices||0)),
    el("td",{},String(u.referrals||0)),

    const prices={ru:{premium:{},ultimate:{}},intl:{premium:{},ultimate:{}},balance:{ru:{},intl:{}}};
    const setp=(path)=>{ const val=parseFloat(inputs[path].value); if(isNaN(val))return; const seg=path.split(".");
      if(seg[0]==="balance"){ prices.balance[seg[1]][seg[2]]=val; } else { prices[seg[0]][seg[1]][seg[2]]=val; } };
    Object.keys(inputs).forEach(setp);
    prices.crypto_discount=parseFloat(crypto.value)||0;
    const tiers=JSON.parse(JSON.stringify(eco.tiers||[])); if(tiers[0]) tiers[0].devices=parseInt(freeDev.value,10)||0;
    try{ await api("/v1/admin/economy",{method:"POST",body:{economy:{prices,tiers}}}); toast("Цены сохранены — витрина обновлена"); }
    catch(err){ toast(err.message,true); } e.target.disabled=false; }},"Сохранить цены")));
  v.append(card);
};

const FLAG_SECTIONS=[
  {key:"download",title:"Платформы в разделе «Скачать»",items:{ios:"iOS",android:"Android",windows:"Windows",macos:"macOS",linux:"Linux",extension:"Расширение"}},
  {key:"site",title:"Секции сайта",items:{pricing:"Цены",download:"Скачать",support:"Поддержка",legal:"Правовое",hero_widget:"Виджет на главной",features:"Возможности",numbers:"Цифры",faq:"FAQ",import_bridge:"Импорт своего моста",lang_switcher:"Переключатель языка"}},
  {key:"pricing",title:"Модели оплаты",items:{subscriptions:"Подписки",balance:"Пакеты часов",balance_300h:"Пакет 300 ч",annual_toggle:"Годовой переключатель",crypto_discount:"Крипто-скидка"}},
  {key:"app",title:"Возможности приложения",items:{import_bridge:"Импорт моста",wheel:"Колесо",referrals:"Рефералы",network_analysis:"Анализ сети",traffic_map:"Карта трафика",key_checker:"Проверка ключа"}},
  {key:"coming_soon",title:"Блок «Скоро»",items:{enabled:"Показывать блок",apple_tv:"Apple TV",android_tv:"Android TV",openwrt:"OpenWRT",cli:"CLI"}},
  {key:"legal",title:"Правовые блоки",items:{canary:"Warrant canary",law_requests:"Запросы органов",key_revocations:"Отзывы ключей",jurisdictions:"Юрисдикции"}},
];
VIEWS.flags=async function(){
  const v=$("#view"); v.innerHTML="";
  const flags=await api("/v1/config/flags"); const pending={};
  const card=el("div",{class:"card"});
  card.append(el("div",{class:"row"},el("h3",{style:"margin:0;flex:1"},"Блоки сайта и приложения"),el("span",{class:"muted"},"версия "+(flags.version||1))));
  card.append(el("p",{class:"hint"},"Выключенный блок мгновенно прячется у клиентов при следующем опросе. Неизвестный флаг считается включённым."));
  for(const sec of FLAG_SECTIONS){ const wrap=el("div",{class:"flagsec"}); wrap.append(el("h4",{},sec.title));
    const cur=flags[sec.key]||{};
    for(const k in sec.items){ const cb=el("input",{type:"checkbox"}); cb.checked=cur[k]!==false;
      cb.addEventListener("change",()=>{ pending[sec.key]=pending[sec.key]||{}; pending[sec.key][k]=cb.checked; });
      wrap.append(el("div",{class:"flagrow"},el("span",{},sec.items[k]),el("label",{class:"sw"},cb,el("span",{})))); }
    card.append(wrap); }
  card.append(el("div",{class:"row",style:"margin-top:14px"},el("button",{class:"primary",onclick:async e=>{
    if(!Object.keys(pending).length){ toast("Нет изменений"); return; } e.target.disabled=true;
    try{ const r=await api("/v1/admin/flags",{method:"POST",body:{flags:pending}}); toast("Сохранено · версия "+r.flags.version); renderView(); }
    catch(err){ toast(err.message,true); e.target.disabled=false; } }},"Сохранить изменения")));
  v.append(card);
};

// ── РАБОТНИКИ (владелец) ──────────────────────────────────────────────────────
VIEWS.staff=async function(){
  const v=$("#view"); v.innerHTML="";
  const f=el("div",{class:"card"}); f.append(el("h3",{},"Добавить работника"));
  const iName=el("input",{placeholder:"Имя (напр. Оператор Аня)"}); f.append(el("label",{},"Имя"),iName);
  f.append(el("label",{},"Права доступа"));
  const boxes={}; const sc=el("div",{class:"row",style:"gap:14px"});
  for(const s in SCOPE_LABELS){ const cb=el("input",{type:"checkbox",style:"width:auto"}); boxes[s]=cb;
    sc.append(el("label",{style:"display:flex;gap:6px;align-items:center;margin:0"},cb,SCOPE_LABELS[s])); }
  f.append(sc);
  f.append(el("div",{class:"row",style:"margin-top:12px"},el("button",{class:"primary",onclick:async()=>{
    const scopes=Object.keys(boxes).filter(s=>boxes[s].checked);
    if(!iName.value.trim()||!scopes.length){ toast("Имя и хотя бы одно право",true); return; }
    try{ const r=await api("/v1/admin/staff",{method:"POST",body:{name:iName.value.trim(),scopes}});
      showToken(r); iName.value=""; Object.values(boxes).forEach(c=>c.checked=false); renderView(); }catch(e){ toast(e.message,true); } }},"Создать токен работника")));
  v.append(f);
  const d=await api("/v1/admin/staff");
  const card=el("div",{class:"card"}); card.append(el("h3",{},"Работники ("+d.total+")"));
  if(!d.total){ card.append(el("div",{class:"empty"},"Работников пока нет.")); }
  else{ const tb=el("table"); card.append(el("div",{class:"scroll"},tb));
    tb.append(el("tr",{},...["Имя","Права","Статус",""].map(h=>el("th",{},h))));
    for(const s of d.staff){ tb.append(el("tr",{},el("td",{},el("b",{},esc(s.name))),
      el("td",{},(s.scopes||[]).map(x=>el("span",{class:"pill",style:"margin:1px"},SCOPE_LABELS[x]||x))),
      el("td",{},s.revoked?el("span",{class:"pill bad"},"отозван"):el("span",{class:"pill ok"},"активен")),
      el("td",{},s.revoked?null:el("div",{class:"row",style:"gap:4px"},
        el("button",{class:"sm",onclick:()=>editStaff(s)},"Права"),
        el("button",{class:"danger sm",onclick:async()=>{ if(!confirm("Отозвать доступ «"+s.name+"»?"))return;
          try{ await api("/v1/admin/staff/"+encodeURIComponent(s.id)+"/revoke",{method:"POST"}); toast("Отозван"); renderView(); }catch(e){ toast(e.message,true); }}},"Отозвать"))))); }
  }
  v.append(card);
};
function editStaff(s){ const b=el("div",{}); b.append(el("h3",{},"Права «"+esc(s.name)+"»"));
  const boxes={}; const sc=el("div",{class:"row",style:"gap:14px;margin:8px 0"});
  for(const k in SCOPE_LABELS){ const cb=el("input",{type:"checkbox",style:"width:auto"}); cb.checked=(s.scopes||[]).includes(k); boxes[k]=cb;
    sc.append(el("label",{style:"display:flex;gap:6px;align-items:center;margin:0"},cb,SCOPE_LABELS[k])); }
  b.append(sc);
  b.append(el("div",{class:"row",style:"justify-content:flex-end"},el("button",{onclick:()=>ov.remove()},"Отмена"),
    el("button",{class:"primary",onclick:async()=>{ const scopes=Object.keys(boxes).filter(k=>boxes[k].checked);
      if(!scopes.length){ toast("Хотя бы одно право",true); return; }
      try{ await api("/v1/admin/staff/"+encodeURIComponent(s.id),{method:"PATCH",body:{scopes}}); toast("Права обновлены"); ov.remove(); renderView(); }catch(e){ toast(e.message,true); } }},"Сохранить")));
  const ov=modal(b); }
function showToken(r){ const b=el("div",{}); b.append(el("h3",{},"Токен работника «"+esc(r.name)+"»"),
  el("p",{class:"hint"},"Покажется ОДИН раз. Права: "+(r.scopes||[]).map(x=>SCOPE_LABELS[x]||x).join(", ")),
  el("input",{value:r.token,readonly:"",onclick:e=>e.target.select(),class:"mono"}),
  el("div",{class:"row",style:"margin-top:12px;justify-content:flex-end"},
    el("button",{onclick:async()=>{ try{ await navigator.clipboard.writeText(r.token); toast("Скопировано"); }catch(_){}}},"Скопировать"),
    el("button",{class:"primary",onclick:()=>ov.remove()},"Готово"))); const ov=modal(b); }

// ── ЖУРНАЛ (владелец) ─────────────────────────────────────────────────────────
const AUDIT_LABELS={grant:"грант",fraud_flag:"фрод",unfraud:"снят фрод",balance_adjust:"баланс",device_revoke:"отзыв устройства",
  node_remove:"снят узел",discount_create:"скидка +",discount_revoke:"скидка −",flags_set:"блоки",economy_set:"цены",
  staff_create:"работник +",staff_edit:"работник ✎",staff_revoke:"работник −",key_issue:"ключ +",key_revoke:"ключ −",
  payment_confirm:"платёж ✓",payment_fail:"платёж ✗",payment_refund:"возврат",rollout:"выкатка",support_reply:"ответ",support_closed:"закрыт",support_open:"открыт"};
VIEWS.audit=async function(){
  const v=$("#view"); v.innerHTML="";
  const d=await api("/v1/admin/audit?limit=200");
  const card=el("div",{class:"card"}); card.append(el("h3",{},"Журнал действий ("+d.total+")"),
    el("p",{class:"hint"},"Кто из операторов что сделал. Последние сверху."));
  if(!d.entries.length){ card.append(el("div",{class:"empty"},"Пока пусто.")); }
  else{ const tb=el("table"); card.append(el("div",{class:"scroll"},tb));
    tb.append(el("tr",{},...["Когда","Кто","Действие","Объект","Детали"].map(h=>el("th",{},h))));
    for(const e of d.entries){ const det=Object.keys(e).filter(k=>!["at","by","role","action","target"].includes(k))
        .map(k=>k+"="+(typeof e[k]==="object"?JSON.stringify(e[k]):e[k])).join(" ");
      tb.append(el("tr",{},el("td",{class:"muted"},fmtWhen(e.at)),
        el("td",{},el("b",{},esc(e.by||"—")),el("span",{class:"pill",style:"margin-left:4px"},e.role==="owner"?"влад.":"раб.")),
        el("td",{},el("span",{class:"pill blue"},AUDIT_LABELS[e.action]||e.action)),
        el("td",{class:"mono muted"},e.target?short(e.target):"—"),el("td",{class:"muted"},det))); }
  }
  v.append(card);
};

// ── ВХОД / ВЫХОД ──────────────────────────────────────────────────────────────
$("#in-role").addEventListener("change",e=>{ $("#lbl-token").textContent=e.target.value==="owner"?"ADMIN_TOKEN":"Токен работника"; });
$("#btn-login").addEventListener("click",async()=>{
  const base=$("#in-base").value.trim(),role=$("#in-role").value,token=$("#in-token").value.trim();
  if(!base||!token){ $("#login-err").textContent="Заполните адрес и токен."; return; }
  state.base=base; state.role=role; state.token=token; $("#login-err").textContent="Проверяем…";
  try{ const w=await api("/v1/admin/whoami"); state.scopes=w.scopes||[]; state.name=w.name||""; state.role=w.role||role; save(); enterApp(); }
  catch(e){ $("#login-err").textContent="Не удалось войти: "+e.message; }
});
$("#btn-logout").addEventListener("click",()=>{ localStorage.removeItem("sib-console"); location.reload(); });
$("#btn-refresh").addEventListener("click",()=>renderView());
function enterApp(){ $("#login").style.display="none"; $("#app").style.display="block";
  $("#whoami").innerHTML=state.role==="owner"?"вошли как <b>Владелец</b>"
    :"работник <b>"+esc(state.name||"—")+"</b> · "+(state.scopes.map(s=>SCOPE_LABELS[s]||s).join(", ")||"без прав");
  renderTabs(); renderView(); }
(function(){ const s=load();
  if(s.base) $("#in-base").value=s.base;
  if(s.role){ $("#in-role").value=s.role; $("#lbl-token").textContent=s.role==="owner"?"ADMIN_TOKEN":"Токен работника"; }
  if(s.base&&s.token){ state.base=s.base; state.role=s.role||"owner"; state.token=s.token;
    api("/v1/admin/whoami").then(w=>{ state.scopes=w.scopes||[]; state.name=w.name||""; state.role=w.role||state.role; enterApp(); }).catch(()=>{}); }
})();
</script>
