<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<script src="./site-i18n.js"></script>
</helmet>
<div style="{{ wrapStyle }}">
  <div style="{{ innerStyle }}">
    <div style="display:flex; flex-wrap:wrap; gap:44px 40px;">

      <div style="flex:1 1 300px; min-width:0; display:flex; flex-direction:column; gap:16px;">
        <a href="Симбионт - сайт - Главная.dc.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
          <span style="width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#3DF0BB,#1FA67D); display:flex; align-items:center; justify-content:center; flex:0 0 auto;"><span style="font-family:'Material Symbols Rounded'; font-variation-settings:'FILL' 1,'wght' 600; font-size:20px; color:#06231A;">all_inclusive</span></span>
          <span style="font-weight:800; font-size:17px; color:#EAF1EF; letter-spacing:-0.01em;">{{ brand }}</span>
        </a>
        <div style="font-size:13.5px; line-height:1.55; color:#7C8A99; max-width:300px;">{{ tagline }}</div>
        <div style="display:inline-flex; align-items:center; gap:9px; padding:8px 13px; border-radius:999px; background:rgba(52,229,176,0.08); border:1px solid rgba(52,229,176,0.20); width:fit-content;">
          <span style="position:relative; width:8px; height:8px; flex:0 0 auto;"><span style="position:absolute; inset:0; border-radius:50%; background:#34E5B0;"></span></span>
          <span style="font-size:12px; font-weight:600; color:#34E5B0;">{{ status }}</span>
        </div>
        <div style="display:flex; gap:9px; margin-top:2px;">
          <a href="#" style="width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); display:flex; align-items:center; justify-content:center; color:#9DABA8; text-decoration:none;" style-hover="color:#34E5B0; border-color:rgba(52,229,176,0.3);"><span style="font-family:'Material Symbols Rounded'; font-size:19px;">send</span></a>
          <a href="#" style="width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); display:flex; align-items:center; justify-content:center; color:#9DABA8; text-decoration:none;" style-hover="color:#34E5B0; border-color:rgba(52,229,176,0.3);"><span style="font-family:'Material Symbols Rounded'; font-size:19px;">code</span></a>
          <a href="#" style="width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.07); display:flex; align-items:center; justify-content:center; color:#9DABA8; text-decoration:none;" style-hover="color:#34E5B0; border-color:rgba(52,229,176,0.3);"><span style="font-family:'Material Symbols Rounded'; font-size:19px;">mail</span></a>
        </div>
      </div>

      <div style="flex:2 1 540px; min-width:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:32px 24px;">
        <sc-for list="{{ cols }}" as="c" hint-placeholder-count="4">
          <div style="display:flex; flex-direction:column; gap:13px;">
            <span style="font-size:11px; font-weight:700; letter-spacing:0.12em; color:#566270;">{{ c.head }}</span>
            <div style="display:flex; flex-direction:column; gap:11px;">
              <sc-for list="{{ c.links }}" as="l" hint-placeholder-count="5">
                <a href="{{ l.href }}" style="font-size:13.5px; color:#9DABA8; text-decoration:none;" style-hover="color:#EAF1EF;">{{ l.label }}</a>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>

    </div>

    <div style="margin-top:44px; padding-top:22px; border-top:1px solid rgba(255,255,255,0.06); display:flex; flex-wrap:wrap; align-items:center; gap:14px 22px;">
      <span style="font-size:12.5px; color:#566270;">{{ copyright }}</span>
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#566270;"><span style="font-family:'Material Symbols Rounded'; font-size:15px; color:#34E5B0;">visibility_off</span>{{ noLogs }}</span>
      <span style="flex:1;"></span>
      <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#46515C;">{{ engine }}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang:'ru' };
  componentDidMount(){
    try{ const l=localStorage.getItem('sym-site-lang'); if(l) this.setState({ lang:l }); }catch(e){}
    this._onLang = (e) => { let l=(e&&e.detail); if(!l){ try{ l=localStorage.getItem('sym-site-lang'); }catch(_){} } if(l) this.setState({ lang:l }); };
    this._onStore = (e) => { if(e&&e.key==='sym-site-lang'&&e.newValue) this.setState({ lang:e.newValue }); };
    this._onI18n = () => this.forceUpdate();
    window.addEventListener('sym-lang', this._onLang);
    window.addEventListener('storage', this._onStore);
    window.addEventListener('sym-site-i18n', this._onI18n);
  }
  componentWillUnmount(){
    if(this._onLang) window.removeEventListener('sym-lang', this._onLang);
    if(this._onStore) window.removeEventListener('storage', this._onStore);
    if(this._onI18n) window.removeEventListener('sym-site-i18n', this._onI18n);
  }
  renderVals(){
    const lang = this.state.lang;
    const T = (k)=> (typeof window!=='undefined' && window.symSiteT) ? window.symSiteT(lang,k) : k;
    const rtl = (typeof window!=='undefined' && window.symSiteRTL) ? window.symSiteRTL(lang) : false;
    const brand = (typeof window!=='undefined' && window.symSiteBrand) ? window.symSiteBrand(lang) : 'Симбионт';
    const H = 'Симбионт - сайт - Главная.dc.html', P = 'Симбионт - сайт - Цены.dc.html',
          D = 'Симбионт - сайт - Скачать.dc.html', S = 'Симбионт - сайт - Поддержка.dc.html',
          A = 'Симбионт - сайт - Аккаунт.dc.html', L = 'Симбионт - сайт - Правовое.dc.html';
    const cols = [
      { head:T('colProduct'), links:[
        {label:T('lkFeatures'), href:H+'#features'},
        {label:T('lkCascade'), href:H+'#cascade'},
        {label:T('lkKeyCheck'), href:P+'#key'},
        {label:T('lkPricing'), href:P},
        {label:T('lkAccount'), href:A}
      ]},
      { head:T('colPlatforms'), links:[
        {label:'iOS · iPhone', href:D},
        {label:'Android', href:D},
        {label:'Windows', href:D},
        {label:'macOS', href:D},
        {label:T('lkLinux'), href:D}
      ]},
      { head:T('colResources'), links:[
        {label:T('lkSupport'), href:S},
        {label:T('lkGlossary'), href:S+'#glossary'},
        {label:T('lkFaq'), href:S+'#faq'},
        {label:T('lkStatus'), href:S+'#status'},
        {label:T('lkReferrals'), href:A+'#referral'}
      ]},
      { head:T('colLegal'), links:[
        {label:T('lkPrivacy'), href:L+'#privacy'},
        {label:T('lkTerms'), href:L+'#terms'},
        {label:T('lkRevocation'), href:L+'#revocation'},
        {label:T('lkTransparency'), href:L+'#transparency'}
      ]}
    ];
    const wrapStyle = { background:'#060809', borderTop:'1px solid rgba(255,255,255,0.07)', color:'#9DABA8', fontFamily:"'Golos Text',system-ui,sans-serif", direction: rtl?'rtl':'ltr' };
    const innerStyle = { maxWidth:'1240px', margin:'0 auto', padding:'56px 32px 30px' };
    return { cols, brand, wrapStyle, innerStyle,
      tagline:T('footTagline'), status:T('footStatus'), noLogs:T('footNoLogs'), engine:T('footEngine'),
      copyright:'© 2026 '+brand };
  }
}
</script>
</body>
</html>
