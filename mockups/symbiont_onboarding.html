<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Симбионт — вход</title>
<style>
  :root{
    --accent:#34E5B0; --accent-text:#06231A;
    --txt:#EAF1EF; --txt2:#C2CCCA; --txt3:#9DABA8; --muted:#7C8A99; --faint:#566270;
    --line:rgba(255,255,255,0.07); --line2:rgba(255,255,255,0.12);
    --surface:rgba(255,255,255,0.04); --surface2:rgba(255,255,255,0.025);
    --st-direct:#5BE5A6; --st-bypass:#F5C451; --st-tunnel:#34E5B0; --st-relay:#A78BFA;
    --ui:'Golos Text','Noto Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(78% 46% at 50% -6%, rgba(52,229,176,0.10), transparent 58%),
      linear-gradient(180deg, #0E1C18 0%, #0A1013 44%, #070B0C 100%);
    color:var(--txt); font-family:var(--ui); line-height:1.5;
    -webkit-font-smoothing:antialiased; min-height:100%;
    display:flex; align-items:center; justify-content:center; padding:40px 20px;
  }
  .card{width:100%; max-width:620px; text-align:center}

  /* лого + бренд */
  .brand{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:30px}
  .logo{width:54px; height:54px; border-radius:15px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    box-shadow:0 8px 30px -8px rgba(52,229,176,0.5)}
  .logo svg{width:30px; height:30px}
  .brand b{font-size:30px; font-weight:800; letter-spacing:-.02em; color:var(--txt)}

  h1{font-size:clamp(24px,4.6vw,30px); font-weight:700; letter-spacing:-.015em; margin:0 0 10px}
  .desc{color:var(--muted); font-size:15px; max-width:48ch; margin:0 auto 30px}

  .label{display:block; text-align:left; color:var(--txt3); font-size:13px;
    font-weight:500; margin:0 0 8px}
  .field{position:relative}
  input.key{width:100%; border:1px solid var(--line); background:var(--surface);
    color:var(--txt); font-family:var(--mono); font-size:15px; letter-spacing:.02em;
    padding:17px 16px; border-radius:12px; outline:0; transition:border-color .18s, box-shadow .18s}
  input.key::placeholder{color:var(--faint)}
  input.key:focus{border-color:rgba(52,229,176,0.4); box-shadow:0 0 0 4px rgba(52,229,176,0.08)}

  button.start{width:100%; margin-top:14px; border:0; cursor:pointer;
    background:linear-gradient(135deg,#3DF0BB,#1FA67D); color:var(--accent-text);
    font-family:var(--ui); font-size:15.5px; font-weight:700; padding:17px 18px;
    border-radius:14px; display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 10px 30px -10px rgba(31,166,125,0.5); transition:filter .15s, transform .05s}
  button.start:hover{filter:brightness(1.06)} button.start:active{transform:translateY(1px)}
  button.start svg{width:18px; height:18px}

  .create{margin:18px 0 0; font-size:14px; color:var(--muted)}
  .create a{color:var(--accent); font-weight:600; text-decoration:none; cursor:pointer}
  .create a:hover{text-decoration:underline}

  /* каскад: прямой → обход → VPN → реле */
  .cascade{display:flex; align-items:center; justify-content:center; gap:0;
    margin-top:34px; flex-wrap:wrap}
  .stage{display:flex; align-items:center; gap:8px; padding:0 4px}
  .stage .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
  .stage span{font-size:12.5px; color:var(--txt3); white-space:nowrap}
  .link{width:26px; height:1px; background:var(--line2); margin:0 2px}

  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M7.5 8.5c-2 0-3.5 1.6-3.5 3.5s1.5 3.5 3.5 3.5c2.2 0 3.3-1.9 4.5-3.5
                   1.2-1.6 2.3-3.5 4.5-3.5 2 0 3.5 1.6 3.5 3.5s-1.5 3.5-3.5 3.5c-2.2 0-3.3-1.9-4.5-3.5
                   -1.2-1.6-2.3-3.5-4.5-3.5z"
                stroke="#06231A" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <b>Симбионт</b>
    </div>

    <h1>Связь, которая подстраивается</h1>
    <p class="desc">Не тумблер «вкл/выкл», а живой каскад: прямой → обход → VPN → реле.
       Детектит занавес и сам выбирает путь.</p>

    <label class="label" for="key">Токен или ключ доступа</label>
    <div class="field">
      <input id="key" class="key" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="sb_live_…  или  СИМБ-XXXX">
    </div>

    <button class="start" id="start">
      Начать
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6"
           stroke="#06231A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <p class="create">Нет аккаунта? <a id="create">Создать за 30 секунд</a></p>

    <div class="cascade">
      <div class="stage"><span class="dot" style="background:var(--st-direct)"></span><span>Прямой</span></div>
      <div class="link"></div>
      <div class="stage"><span class="dot" style="background:var(--st-bypass)"></span><span>Обход</span></div>
      <div class="link"></div>
      <div class="stage"><span class="dot" style="background:var(--st-tunnel)"></span><span>VPN</span></div>
      <div class="link"></div>
      <div class="stage"><span class="dot" style="background:var(--st-relay)"></span><span>Реле</span></div>
    </div>
  </main>

  <script>
    // лёгкая интерактивность без фреймворка (на замену рантайму Claude Design)
    var key = document.getElementById('key');
    document.getElementById('start').addEventListener('click', function(){
      var v = (key.value || '').trim();
      key.style.borderColor = v ? 'rgba(52,229,176,0.4)' : 'rgba(255,107,106,0.6)';
      if(!v) key.focus();
      // здесь реальный клиент вызвал бы вход/активацию
    });
    key.addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('start').click(); });
    document.getElementById('create').addEventListener('click', function(){ key.focus(); });
  </script>
</body>
</html>
