# Веб-портал Симбионта: статика оболочки + обратный прокси на бэкенд.
# Оболочка и /v1 на ОДНОМ origin → SYM_CONFIG не нужен (мост по умолчанию
# ходит на тот же origin, live=true), CORS не задействован.

upstream symbiont_backend {
    server 127.0.0.1:8600;   # адрес FastAPI (symbiont_build/backend)
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;      # сюда кладётся содержимое webapp/
    index "Симбионт.dc.html";
    charset utf-8;

    # API → бэкенд
    location /v1/ {
        proxy_pass         http://symbiont_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Статика оболочки (React/Babel/шрифты/флаги/иконки — всё локально)
    location / {
        try_files $uri $uri/ =404;
    }

    # Долгий кеш для вшитых ассетов
    location ~* \.(woff2?|ttf|png|svg|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
